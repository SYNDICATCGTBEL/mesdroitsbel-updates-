<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Mes Droits BEL - Vérification e-mail</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; background: #f5f7fa; color: #172033; }
    main { max-width: 560px; margin: 8vh auto; padding: 28px; background: #fff; border-radius: 20px; box-shadow: 0 12px 40px rgba(23,32,51,.12); }
    h1 { margin-top: 0; font-size: 1.65rem; }
    p { line-height: 1.55; }
    .ok { color: #176b3a; }
    .error { color: #b42318; }
    form { display: none; gap: 12px; margin-top: 20px; }
    label { display: grid; gap: 6px; font-weight: 650; }
    input { min-height: 44px; padding: 0 12px; border: 1px solid #ccd4df; border-radius: 10px; font: inherit; }
    button { min-height: 44px; border: 0; border-radius: 22px; padding: 0 18px; background: #c62828; color: #fff; font-weight: 750; cursor: pointer; }
    .secondary { background: #173b68; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
    small { color: #687386; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Vérification de votre e-mail</h1>
    <p id="message">Traitement du lien en cours…</p>

    <form id="reset-form">
      <label>
        Nouveau mot de passe
        <input id="password" type="password" autocomplete="new-password" minlength="8" required>
      </label>
      <label>
        Confirmer le mot de passe
        <input id="password-confirm" type="password" autocomplete="new-password" minlength="8" required>
      </label>
      <button type="submit">Enregistrer le nouveau mot de passe</button>
      <small>Utilisez au moins 8 caractères et conservez ce mot de passe dans un gestionnaire sécurisé.</small>
    </form>

    <div class="actions">
      <button id="open-app" class="secondary" type="button">Ouvrir Mes Droits BEL</button>
    </div>
  </main>

  <script>
    (() => {
      const SUPABASE_URL = "https://fqpjifhxmlyoiejzjoxo.supabase.co";
      const SUPABASE_ANON_KEY = "sb_publishable_EWQfulLHZCZBSJBKXVwXUw_WPwxRFNx";
      const title = document.getElementById('title');
      const message = document.getElementById('message');
      const form = document.getElementById('reset-form');
      const openApp = document.getElementById('open-app');

      const params = new URLSearchParams(window.location.search);
      const hash = new URLSearchParams(window.location.hash.replace(/^#/, ''));
      for (const [key, value] of hash.entries()) {
        if (!params.has(key)) params.set(key, value);
      }

      const error = params.get('error_description') || params.get('error');
      const type = params.get('type') || '';
      const accessToken = params.get('access_token') || '';

      openApp.addEventListener('click', () => {
        window.location.href = 'mesdroitsbel://auth/login';
      });

      if (error) {
        title.textContent = 'Lien invalide ou expiré';
        message.textContent = error;
        message.className = 'error';
        return;
      }

      if (type === 'recovery' && accessToken) {
        title.textContent = 'Choisir un nouveau mot de passe';
        message.textContent = 'Votre lien de récupération est valide.';
        message.className = 'ok';
        form.style.display = 'grid';

        form.addEventListener('submit', async (event) => {
          event.preventDefault();
          const password = document.getElementById('password').value;
          const confirmation = document.getElementById('password-confirm').value;
          if (password.length < 8) {
            message.textContent = 'Le mot de passe doit contenir au moins 8 caractères.';
            message.className = 'error';
            return;
          }
          if (password !== confirmation) {
            message.textContent = 'Les deux mots de passe ne correspondent pas.';
            message.className = 'error';
            return;
          }
          if (!SUPABASE_URL || !SUPABASE_ANON_KEY) {
            message.textContent = 'La configuration de récupération est incomplète. Contactez l’administrateur.';
            message.className = 'error';
            return;
          }
          try {
            const response = await fetch(`${SUPABASE_URL}/auth/v1/user`, {
              method: 'PUT',
              headers: {
                apikey: SUPABASE_ANON_KEY,
                Authorization: `Bearer ${accessToken}`,
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({ password })
            });
            if (!response.ok) {
              const body = await response.json().catch(() => ({}));
              throw new Error(body.msg || body.message || body.error_description || body.error || `Erreur HTTP ${response.status}`);
            }
            form.style.display = 'none';
            title.textContent = 'Mot de passe mis à jour';
            message.textContent = 'Votre mot de passe a été modifié. Vous pouvez maintenant ouvrir Mes Droits BEL et vous connecter.';
            message.className = 'ok';
            history.replaceState(null, '', window.location.pathname);
          } catch (err) {
            message.textContent = err instanceof Error ? err.message : 'La réinitialisation a échoué.';
            message.className = 'error';
          }
        });
        return;
      }

      title.textContent = 'Adresse e-mail vérifiée';
      message.textContent = 'Votre adresse e-mail est confirmée. Revenez dans Mes Droits BEL. Votre accès restera en attente tant qu’un administrateur n’aura pas validé votre inscription.';
      message.className = 'ok';
      history.replaceState(null, '', window.location.pathname);
    })();
  </script>
</body>
</html>
