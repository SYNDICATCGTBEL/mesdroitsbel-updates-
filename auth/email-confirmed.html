<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Mes Droits BEL - Adresse e-mail confirmée</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { margin: 0; background: #f5f7fa; color: #172033; }
    main { max-width: 560px; margin: 8vh auto; padding: 28px; background: #fff; border-radius: 20px; box-shadow: 0 12px 40px rgba(23,32,51,.12); }
    h1 { margin-top: 0; font-size: 1.65rem; }
    p { line-height: 1.55; }
    .ok { color: #176b3a; }
    .error { color: #b42318; }
    button { min-height: 44px; border: 0; border-radius: 22px; padding: 0 18px; background: #173b68; color: #fff; font-weight: 750; cursor: pointer; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }
    small { display:block; color:#687386; margin-top:18px; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Adresse e-mail confirmée</h1>
    <p id="message" class="ok">
      Votre adresse e-mail a bien été confirmée. Votre compte est maintenant en attente de validation
      par un élu ou une élue CGT BEL. Vous pourrez vous connecter après validation de votre inscription.
    </p>

    <div class="actions">
      <button id="open-app" type="button">Ouvrir Mes Droits BEL</button>
    </div>

    <small>Page de confirmation V2.2</small>
  </main>

  <script>
    (() => {
      const title = document.getElementById('title');
      const message = document.getElementById('message');
      const openApp = document.getElementById('open-app');

      const query = new URLSearchParams(window.location.search);
      const hash = new URLSearchParams(window.location.hash.replace(/^#/, ''));
      const error =
        hash.get('error_description') ||
        hash.get('error') ||
        query.get('error_description') ||
        query.get('error');

      if (error) {
        title.textContent = 'Lien invalide ou expiré';
        message.textContent = error;
        message.className = 'error';
      } else {
        history.replaceState(null, '', window.location.pathname);
      }

      openApp.addEventListener('click', () => {
        window.location.href = 'mesdroitsbel://auth/login';
      });
    })();
  </script>
</body>
</html>
